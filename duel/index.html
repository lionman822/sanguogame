<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101018"><title>三国·武将巅峰对决</title><style>
:root{color-scheme:dark;--gold:#ead09c;--edge:#716047}*{box-sizing:border-box}body{margin:0;background:#100f15;color:#f6eddf;font:15px/1.5 system-ui,"PingFang SC",sans-serif}header{padding:22px 16px 13px;text-align:center;background:linear-gradient(140deg,#33231d,#151622);border-bottom:1px solid var(--edge)}h1{font-size:clamp(24px,6vw,36px);margin:2px 0;color:var(--gold);letter-spacing:3px}small,.sub{color:#bcb3a5}.shell{max-width:960px;margin:auto;padding:14px}.panel{border:1px solid #4c433e;border-radius:14px;background:#1d1d26;padding:15px;margin-bottom:12px}h2{font-size:17px;margin:0 0 12px;color:var(--gold)}.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}select,button{width:100%;padding:12px;border-radius:9px;border:1px solid #615447;background:#252532;color:#f6eddf;font-size:15px}button{cursor:pointer;background:linear-gradient(140deg,#875128,#b67840);border-color:#d39960;color:#fff;font-weight:700}button:disabled{opacity:.5}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.attrs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.box{padding:10px;background:#272631;border:1px solid #55493e;border-radius:10px}.stat{height:6px;background:#3a3739;border-radius:8px;overflow:hidden;margin:4px 0 8px}.stat i{display:block;height:100%;background:#ca9255}.arena{position:relative;height:280px;overflow:hidden;border-radius:12px;border:1px solid #8c6840;background:radial-gradient(ellipse at 50% 100%,#866348,#42392d 55%,#1b242f);box-shadow:inset 0 -45px 50px #201b1b}.sun{position:absolute;right:12%;top:12%;width:45px;height:45px;background:#dba65d;border-radius:50%;box-shadow:0 0 45px #c78345}.mount{position:absolute;bottom:39px;width:130px;height:120px;transition:transform .22s}.left{left:10%}.right{right:10%;transform:scaleX(-1)}.mount svg{height:100%;width:100%;filter:drop-shadow(2px 7px 2px #261e20)}.mount.attack.left{transform:translateX(45px)}.mount.attack.right{transform:scaleX(-1) translateX(45px)}.mount.hit{filter:brightness(1.8) sepia(.3)}.dust{position:absolute;bottom:0;width:100%;height:54px;background:linear-gradient(transparent,#9c734b6b)}.vs{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);color:#f4d6a0;font:italic 30px Georgia,serif;text-shadow:0 2px 10px #000}.fightername{position:absolute;bottom:10px;font-weight:800;text-shadow:1px 2px 4px #000}.fightername.a{left:12%}.fightername.b{right:12%}.bars{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.hp{height:13px;background:#46383a;border-radius:10px;overflow:hidden}.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#b7353b,#f09271);transition:width .3s}.log{height:175px;overflow:auto;background:#12141a;border:1px solid #444;border-radius:8px;padding:10px;font-size:13px}.log p{margin:0 0 8px}.highlight{color:#f6cf91}.result{text-align:center;color:#f1cc92;font-size:19px;min-height:30px;margin:8px}.muted{color:#b0a9a2;font-size:13px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.row button{width:auto}footer{text-align:center;padding:20px;color:#a6a09a;font-size:12px}@media(min-width:700px){.layout{display:grid;grid-template-columns:1fr 1.2fr;gap:14px}.arena{height:350px}.mount{width:175px;height:155px}}
</style><header><small>AI DUEL ARENA · 三国武将竞技场</small><h1>三国·武将巅峰对决</h1><div class="sub">跨时空单挑 · 智能战术 · 实时演算</div></header><main class="shell"><div class="layout"><section><div class="panel"><h2>一、选择对战武将</h2><div class="pick"><label>挑战者<select id="a"></select></label><label>迎战者<select id="b"></select></label></div><div class="attrs" id="attrs" style="margin-top:12px"></div></div><div class="panel"><h2>二、决斗规则</h2><div class="options"><label>战场<select id="weather"><option value="晴朗">晴朗</option><option value="风沙">风沙</option><option value="暴雨">暴雨</option><option value="雪原">雪原</option></select></label><label>模式<select id="mode"><option value="史演混合">史演混合</option><option value="演义传奇">演义传奇</option><option value="史实克制">史实克制</option></select></label></div><p class="muted">人物数值、技能和胜率是娱乐性模拟，不代表可验证的历史单挑数据。</p><button id="go">⚔ 开始AI自动对决</button></div></section><section><div class="panel"><h2>三、现场直播</h2><div class="arena"><div class="sun"></div><div class="mount left" id="f0"></div><div class="mount right" id="f1"></div><div class="vs">VS</div><div class="dust"></div><span class="fightername a" id="na"></span><span class="fightername b" id="nb"></span></div><div class="bars"><div><div id="hna"></div><div class="hp"><i id="hp0"></i></div><small id="st0"></small></div><div><div id="hnb"></div><div class="hp"><i id="hp1"></i></div><small id="st1"></small></div></div><div class="result" id="result">选择武将，开始决斗</div><div class="log" id="log"><p>战鼓未响，群雄待命……</p></div><p class="row"><span class="muted" id="summary">实时记录交锋结果</span><button id="copy">复制战报</button></p></div></section></div></main><footer>原创三国题材娱乐模拟游戏 · 本机运行 · 无需登录</footer><script>
const names=[["吕布",99,90,94,98,90,98,"方天画戟"],["关羽",96,91,83,98,95,94,"青龙偃月刀"],["张飞",97,85,87,95,91,97,"丈八蛇矛"],["赵云",94,93,98,96,98,91,"亮银枪"],["马超",94,88,96,94,92,93,"虎头湛金枪"],["黄忠",90,88,83,94,94,85,"凤嘴刀"],["典韦",96,87,79,93,97,98,"双铁戟"],["许褚",94,93,75,88,95,99,"大刀"],["孙策",91,88,91,91,91,91,"长枪"],["太史慈",90,90,89,92,95,90,"双戟"],["甘宁",90,84,95,92,92,88,"大刀"],["魏延",89,87,87,90,90,91,"长刀"]];const $=id=>document.getElementById(id);let busy=false,history=[],step=0,stats=[],p=[],winner=null;function pct(v){return Math.max(0,Math.min(100,v))}function unit(x){return names[+x]}function drawStats(){let a=unit($("a").value),b=unit($("b").value);$("na").textContent=a[0];$("nb").textContent=b[0];$("attrs").innerHTML=[a,b].map(g=>'<div class="box"><b>'+g[0]+'</b><small> · '+g[7]+'</small>'+["攻击","防御","速度","武技","意志","体魄"].map((n,i)=>'<div class="muted">'+n+' '+g[i+1]+'<div class="stat"><i style="width:'+g[i+1]+'%"></i></div></div>').join("")+'</div>').join("")}const horse=(color)=>'<svg viewBox="0 0 170 140"><path fill="'+color+'" stroke="#100e13" stroke-width="3" d="M19 95Q39 65 74 70L105 79 122 47 140 48 157 74 144 82 127 73 119 112 108 112 104 92 77 92 61 116 50 116 56 91 34 90 24 119 14 118Z"/><path d="M76 73Q60 45 73 27L89 28 96 62 112 88" stroke="#d5c0a2" fill="none" stroke-width="12"/><circle cx="80" cy="20" r="12" fill="#d7b596"/><path d="M65 8L77 -8 91 8Z" fill="#50322c"/><path d="M90 29L142 -7" stroke="#d3d2c5" stroke-width="5"/><path d="M140 -12L154 -21" stroke="#f3d5a1" stroke-width="3"/></svg>';$("f0").innerHTML=horse("#8b6045");$("f1").innerHTML=horse("#4a4a56");names.forEach((g,i)=>{["a","b"].forEach(k=>$(k).add(new Option(g[0],i)))});$("a").value=0;$("b").value=3;["a","b"].forEach(k=>$(k).onchange=drawStats);drawStats();function speak(t){history.push(t);$("log").insertAdjacentHTML("beforeend","<p>"+t+"</p>");$("log").scrollTop=$("log").scrollHeight}function refresh(){[0,1].forEach(i=>{let g=stats[i];$("hp"+i).style.width=p[i].hp+"%";$("st"+i).textContent="体力 "+Math.round(p[i].energy)+" · 交锋 "+p[i].strikes+" · 命中 "+p[i].hits;$("h"+(i===0?"na":"nb")).textContent=g[0]+" · "+Math.round(p[i].hp)+" HP"})}const delay=n=>new Promise(r=>setTimeout(r,n));async function battle(){if(busy)return;let a=unit($("a").value),b=unit($("b").value);if(a===b){$("result").textContent="请选择两位不同武将";return}busy=true;$("go").disabled=true;stats=[a,b];p=[{hp:100,energy:100,strikes:0,hits:0,blocks:0},{hp:100,energy:100,strikes:0,hits:0,blocks:0}];step=0;history=[];$("log").innerHTML="";$("result").textContent="战鼓擂动，双方策马而出";speak("⚔ "+a[0]+"（"+a[7]+"）对阵 "+b[0]+"（"+b[7]+"）");speak("战场："+$("weather").value+" · 规则："+$("mode").value);refresh();await delay(550);let max=32;while(p[0].hp>0&&p[1].hp>0&&step<max){step++;let at=step%2===1?0:1,de=1-at,g=stats[at],e=stats[de],f=$("f"+at);let speed=g[3],power=g[1],def=e[2],tech=g[4];let env=$("weather").value,mod=$("mode").value;let hit=pct(67+(tech-e[4])*.6+(speed-e[3])*.3-(env==="暴雨"?7:0)-(env==="风沙"?5:0))*.01;let blockChance=pct(12+(e[2]-g[1])*.5+(e[4]-g[4])*.25)*.01;let critChance=mod==="演义传奇"?.22:mod==="史实克制"?.07:.13;let special=Math.random()<.12&&p[at].energy>25;f.classList.add("attack");await delay(180);f.classList.remove("attack");p[at].strikes++;let t="第"+step+"合 · "+g[0]+" "+(special?"施展绝技，":"挥动"+g[7]+"，");if(Math.random()>hit){t+=e[0]+"侧身闪避！"}else if(Math.random()<blockChance){t+=e[0]+"成功招架！";p[de].blocks++}else{let dmg=Math.max(3,7+(power-def)*.19+Math.random()*10-(100-p[at].energy)*.055);if(Math.random()<critChance){dmg*=1.55;t+="重击命中，"}else t+="击中对手，";if(special){dmg*=1.36;p[at].energy-=14}p[de].hp=pct(p[de].hp-dmg);p[at].hits++;t+=e[0]+"受到 "+Math.round(dmg)+" 点伤害！";$("f"+de).classList.add("hit");setTimeout(()=>$("f"+de).classList.remove("hit"),210)}p[at].energy=pct(p[at].energy-3+Math.random()*2);p[de].energy=pct(p[de].energy-1);speak(t);refresh();await delay(430)}let win=p[0].hp===p[1].hp?-1:p[0].hp>p[1].hp?0:1;winner=win<0?"平局":stats[win][0]+"胜出";$("result").textContent="🏆 "+winner+"！";speak("【战斗结束】"+winner+"，共"+step+"回合。");$("summary").textContent=stats.map((g,i)=>g[0]+" 命中"+p[i].hits+"/"+p[i].strikes).join(" · ");busy=false;$("go").disabled=false} $("go").onclick=battle;$("copy").onclick=()=>{let s=history.join("\n");if(navigator.clipboard?.writeText){navigator.clipboard.writeText(s).then(()=>$("summary").textContent="战报已复制").catch(()=>fallback(s))}else fallback(s)};function fallback(s){let t=document.createElement("textarea");t.value=s;document.body.append(t);t.select();try{document.execCommand("copy");$("summary").textContent="战报已复制"}catch(e){$("summary").textContent="请手动复制战报"}t.remove()}
</script></html>
