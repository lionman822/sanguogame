.warrior { --facing: 1; transform:scaleX(var(--facing)); z-index:1; }
.warrior.right { --facing:-1; transform:scaleX(var(--facing)); }
.warrior .mount { transform-origin:105px 159px; animation:trot 1.18s ease-in-out infinite; }
.warrior.right .mount { animation-delay:-.5s; }
.warrior .rider { transform-origin:136px 110px; }
.warrior .weapon { transform-origin:127px 91px; }
.warrior .leg { transform-origin:var(--joint) 139px; animation:stride 1.18s ease-in-out infinite alternate; }
.warrior .leg:nth-child(even) { animation-delay:-1.18s; }
.warrior .cape { transform-origin:132px 71px; animation:cloth 1.6s ease-in-out infinite alternate; }
.warrior[data-motion="cut"], .warrior[data-motion="thrust"] { animation:lunge 500ms both; z-index:2; }
.warrior[data-motion="cut"] .weapon { animation:cut 500ms both; }
.warrior[data-motion="thrust"] .weapon { animation:thrust 500ms both; }
.warrior[data-motion="cut"] .rider, .warrior[data-motion="thrust"] .rider { animation:lean 500ms both; }
.warrior[data-motion="guard"] .weapon { animation:guard 320ms both; }
.warrior[data-motion="dodge"] { animation:dodge 360ms both; }
.warrior[data-motion="hit"] { animation:recoil 340ms both; }
.warrior[data-motion="fallen"] .rider { transform:translate(-12px,15px) rotate(-32deg); }
.warrior[data-motion="fallen"] .mount, .warrior[data-motion="fallen"] .leg { animation-play-state:paused; }
.view.fighting .vs { opacity:.15; }
.impact { position:absolute; pointer-events:none; z-index:3; top:42%; left:50%; translate:-50% -50%; white-space:nowrap; text-align:center; color:#fff2cb; font:bold clamp(16px,3.7vw,28px) system-ui; text-shadow:0 2px 4px #241411,0 0 9px #241411; }
.impact::before { content:''; display:block; width:clamp(24px,7vw,66px); height:clamp(24px,7vw,66px); margin:auto; }
.impact.hit::before, .impact.critical::before, .impact.guard::before { background:currentColor; clip-path:polygon(50% 0,58% 36%,93% 10%,72% 44%,100% 50%,65% 59%,86% 91%,55% 70%,44% 100%,39% 65%,2% 86%,29% 53%,0 37%,38% 42%); }
.impact.critical { color:#ffbe60; }
.impact.guard { color:#e0eeff; }
.impact.dodge::before { height:16px; border-block:2px solid #ffebbf; transform:skewX(-32deg); opacity:.7; }
.impact:not(:empty) { animation:impact 330ms ease-out both; }
@keyframes trot { 0%,100% {transform:translateY(0)} 50% {transform:translateY(-3px)} }
@keyframes stride { from {transform:rotate(-8deg)} to {transform:rotate(8deg)} }
@keyframes cloth { from {transform:rotate(-4deg) scaleX(.94)} to {transform:rotate(5deg)} }
@keyframes lunge { 0%,100% {transform:scaleX(var(--facing))} 27% {transform:scaleX(var(--facing)) translateX(-5%)} 49% {transform:scaleX(var(--facing)) translateX(23%) translateY(-3%)} 66% {transform:scaleX(var(--facing)) translateX(17%)} }
@keyframes lean { 25% {transform:rotate(-10deg)} 49% {transform:rotate(15deg)} }
@keyframes cut { 28% {transform:rotate(-78deg)} 49% {transform:rotate(37deg)} 69% {transform:rotate(51deg)} }
@keyframes thrust { 27% {transform:translateX(-16px) rotate(22deg)} 47%,54% {transform:translateX(27px) rotate(32deg)} }
@keyframes guard { 20%,58% {transform:rotate(-45deg) translateX(8px)} }
@keyframes dodge { 25%,55% {transform:scaleX(var(--facing)) translateX(-19%) rotate(-7deg)} }
@keyframes recoil { 16% {transform:scaleX(var(--facing)) translateX(-16%) rotate(-9deg); filter:brightness(1.35) drop-shadow(0 0 5px #ffc68e)} 49% {transform:scaleX(var(--facing)) translateX(-9%) rotate(-4deg)} }
@keyframes impact { 0% {opacity:0;transform:scale(.72)} 18%,65% {opacity:1;transform:scale(1)} 100% {opacity:0;transform:translateY(-13px)} }
@media (prefers-reduced-motion:reduce) {
  .warrior, .warrior *, .impact:not(:empty) { animation:none !important; transition:none !important; }
  .impact { opacity:1; }
}
.view { isolation:isolate; }
.warrior[data-figure="guan"], .warrior[data-figure="lu"] {
  width:46%; height:auto; aspect-ratio:18/13; bottom:15%;

.warrior[data-figure="lu"] { --row:100%; }
.warrior[data-figure]:not([data-figure=""])[data-phase="windup"],
.warrior[data-figure]:not([data-figure=""])[data-motion="guard"] { --frame:50%; }
.warrior[data-figure]:not([data-figure=""])[data-phase="charge"],
.warrior[data-figure]:not([data-figure=""])[data-phase="contact"] { --frame:100%; }
.warrior[data-phase="windup"] { animation:gather 245ms ease-out both; }
.warrior[data-figure]:not([data-figure=""])[data-motion="fallen"]::after {

}
.warrior[data-figure]:not([data-figure=""])[data-phase]::after { animation:none; }
.view .strike-trail, .view .hoof-dust {
  position:absolute; pointer-events:none; opacity:0;
}
.strike-trail { z-index:3; left:28%; right:28%; top:31%; height:30%; transform-origin:50% 55%; }
.view[data-direction="left"] .strike-trail { scale:-1 1; }
.view[data-contact][data-strike="cut"] .strike-trail {
  border-top:clamp(3px,1vw,10px) solid #c3f6be;
  border-radius:52% 55% 15% 0;
  box-shadow:0 -4px 17px #6ca676, inset 0 7px 16px #c9ffba88;
  animation:sweep-flash 155ms ease-out both;
}
.view[data-contact][data-strike="thrust"] .strike-trail {
  background:linear-gradient(90deg,transparent,#ff784c 78%,#fff9db);
  clip-path:polygon(0 43%,100% 36%,100% 47%,8% 50%,77% 53%,99% 60%,44% 56%);
  animation:sweep-flash 155ms ease-out both;
}
.hoof-dust { z-index:0; inset:60% 15% 10%; background:radial-gradient(ellipse at center,#e0b68099,transparent 69%); }
.view[data-contact] .hoof-dust { animation:dust-lift 155ms ease-out both; }
@keyframes gather {
  from {transform:scaleX(var(--facing))}
  to {transform:scaleX(var(--facing)) translateX(-5%) rotate(-4deg)}
}
@keyframes horse-breath { 50% {transform:scaleY(1.018)} }
@keyframes sweep-flash { from {opacity:1;transform:scale(.79) rotate(-10deg)} to {opacity:.15;transform:scale(1.14) rotate(7deg)} }
@keyframes dust-lift { from {opacity:.65;transform:scale(.5)} to {opacity:.12;transform:scale(1.1) translateY(-14%)} }
@media (max-width:600px) { .warrior[data-figure="guan"], .warrior[data-figure="lu"] { bottom:21%; } }
@media (prefers-reduced-motion:reduce) {
  .warrior[data-figure]::after, .strike-trail, .hoof-dust { animation:none !important; }
}
